apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-relay
  template:
    metadata:
      labels:
        app: agent-relay
    spec:
      # Kubernetes has no "depends_on: service_healthy" like Compose. Without
      # this, the app container would start immediately, fail to connect to
      # Postgres (main.py calls init_db() at import time), and crash-loop
      # with backoff until Postgres happens to be ready. This initContainer
      # blocks pod startup until Postgres actually accepts connections.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres-credentials
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo waiting for postgres; sleep 2; done
      containers:
        - name: agent-relay
          image: agent-relay:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: RELAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          # These map directly onto the app's own /health and /ready routes.
          # readinessProbe gates whether the Service sends this pod traffic;
          # livenessProbe restarts the container if it stops responding.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agent-relay
spec:
  selector:
    app: agent-relay
  ports:
    - port: 8000
      targetPort: 8000
