name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-sqlite:
    name: Test (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      # No RELAY_DATABASE_URL set: test_agent_relay.py defaults to a scratch
      # SQLite file. test_postgres_integration.py sees a non-Postgres URL and
      # skips itself (see its pytestmark).
      - run: uv run pytest -q

  test-postgres:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_relay
          POSTGRES_PASSWORD: agent_relay
          POSTGRES_DB: agent_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agent_relay -d agent_relay"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      # Same suite as the SQLite job, plus test_postgres_integration.py --
      # test_agent_relay.py is written to respect an existing
      # RELAY_DATABASE_URL, so this re-runs every starter protocol assertion
      # against the real backend instead of only against SQLite.
      - name: Run full suite against PostgreSQL
        env:
          RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@localhost:5432/agent_relay
        run: uv run pytest -q

  build-and-deploy:
    name: Build image and deploy to kind
    needs: [test-sqlite, test-postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t agent-relay:local .

      # Runs only on GitHub's runner -- this is a fresh, throwaway cluster
      # that exists for the length of this job, not the kind cluster on
      # anyone's own machine (a hosted runner has no network path to that).
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: agent-relay

      - name: Load image into kind
        run: kind load docker-image agent-relay:local --name agent-relay

      - name: Deploy manifests
        run: kubectl apply -f k8s/postgres.yaml -f k8s/agent-relay.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status statefulset/postgres --timeout=120s
          kubectl rollout status deployment/agent-relay --timeout=120s

      - name: Smoke test the deployment
        run: |
          kubectl port-forward svc/agent-relay 8080:8000 &
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8080/ready; then
              echo "deployment is ready"
              exit 0
            fi
            sleep 2
          done
          echo "deployment never became ready" >&2
          kubectl get pods
          kubectl logs deployment/agent-relay --all-containers
          exit 1
